services:
  postgres:
    image: postgres:16-alpine
    container_name: codeforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codeforge
      POSTGRES_USER: codeforge
      POSTGRES_PASSWORD: codeforge_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeforge -d codeforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: