spring.application.name=codeforge-backend
server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:codeforge}
spring.datasource.username=${DB_USERNAME:codeforge_user}
spring.datasource.password=${DB_PASSWORD}

# Pagination
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# TODO: Change to false in production
spring.jpa.show-sql=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

# Judge Server
judge.server.url=${JUDGE_SERVER_URL:http://localhost:8080}
judge.server.token=${JUDGE_SERVER_TOKEN}

# Test case storage
judge.storage.path=${JUDGE_STORAGE_PATH}