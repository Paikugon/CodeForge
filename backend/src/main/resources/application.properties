spring.application.name=codeforge-backend
server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:172.30.144.1}:5432/codeforge
spring.datasource.username=${DB_USERNAME:codeforge_user}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true