spring.application.name=codeforge-backend
server.port=0

# Keep tests independent from a locally running PostgreSQL instance.
spring.datasource.url=jdbc:h2:mem:codeforge-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false

spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration for testing
app.jwt.secret=VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdUZXN0U2VjcmV0S2V5MTIzNDU2
app.jwt.expiration-minutes=60

judge.server.url=http://localhost:8080
judge.server.token=test-token
judge.storage.path=${java.io.tmpdir}/codeforge-test-storage
